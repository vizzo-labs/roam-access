<!doctype html>
<html lang="en-AU" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- The static demo that lived here was retired. Old links (including /app/#anything) go to the pilot. -->
  <meta http-equiv="refresh" content="0; url=https://app.roamaccess.com.au/" />
  <title>Roam Access has moved to app.roamaccess.com.au</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://app.roamaccess.com.au/" />
  <meta name="theme-color" content="#FAF9F6" />
  <link rel="icon" type="image/svg+xml" href="/assets/roam-appicon-teal.svg" />
  <link rel="icon" type="image/png" href="/assets/roam-appicon-teal.png" />
  <style>
    :root { --teal:#0A4F4F; --teal-deep:#073838; --paper:#FAF9F6; --charcoal:#1A1A1A; --slate:#5A5651; }
    *{box-sizing:border-box}
    html{font-size:18px}
    body{
      margin:0; min-height:100vh; min-height:100dvh;
      display:flex; align-items:center; justify-content:center;
      padding:2rem 1.25rem; text-align:center;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--paper); color:var(--charcoal);
      line-height:1.6;
    }
    main{display:flex; flex-direction:column; align-items:center; gap:1.5rem}
    h1{font-size:clamp(1.75rem,5vw,2.75rem); letter-spacing:-0.03em; line-height:1.1; margin:0; max-width:20ch}
    p{font-size:1.125rem; color:var(--slate); margin:0; max-width:46ch}
    a{color:var(--teal); font-weight:600; text-decoration:underline; text-underline-offset:4px}
    a:focus-visible{outline:3px solid var(--charcoal); outline-offset:3px; border-radius:4px}
    .go{
      display:inline-flex; align-items:center; min-height:56px; padding:.5rem 1.5rem; line-height:1.3;
      background:var(--teal); color:var(--paper); border-radius:8px; text-decoration:none;
    }
    .go:hover{background:var(--teal-deep)}
  </style>
</head>
<body>
  <main>
    <h1>Roam Access has moved to <a href="https://app.roamaccess.com.au/">app.roamaccess.com.au</a></h1>
    <p>The pilot is live, and free, around Manly and the Northern Beaches.</p>
    <a class="go" href="https://app.roamaccess.com.au/">Open the Roam Access pilot</a>
    <p><a href="/">Back to the Roam Access home page</a></p>
  </main>
</body>
</html>
